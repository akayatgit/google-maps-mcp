service: grounding-lite-app
# sample-app-grounding
# grounding-lite-sampleapp
runtime: nodejs22
entrypoint: npm start
# entrypoint was previously removed to rely on default 'npm start' behavior, but we must specify it explicitly.
instance_class: F1
automatic_scaling:
  max_instances: 1

handlers:
- url: /assets/(.*)
  static_files: dist/assets/\1
  upload: dist/assets/(.*)
  expiration: 30d
- url: /
  static_files: dist/index.html
  upload: dist/index.html
  expiration: 0s
- url: /.*
  script: auto
